
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEB БАҒДАРЛАМАЛАУ — Электрондық кітап</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #344c63, #101b2b);
    color: #f5e9d3;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 25px 12px 10px;
}

header small {
    color: #e2b969;
    letter-spacing: 3px;
}

h1 {
    font-size: clamp(24px, 4vw, 40px);
    margin: 12px 0;
}

header p { color: #cbd4dc; }

.toolbar {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    padding: 15px;
}

button, .download {
    background: #d9ae62;
    color: #1c2530;
    border: none;
    border-radius: 8px;
    padding: 11px 14px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

input {
    width: 70px;
    padding: 10px;
    border-radius: 7px;
    border: none;
}

#counter {
    min-width: 100px;
    text-align: center;
}

.book-area {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 65vh;
    padding: 15px;
    overflow: hidden;
}

#book { margin: auto; }
#book[hidden] { display: none; }

.page {
    background: white;
    overflow: hidden;
    box-shadow: inset 0 0 15px #0002;
}

.page img {
    width: 100%;
    height: 100%;
    display: block;
}

/* Кітап мұқабасы */
.cover {
    background: linear-gradient(145deg, #183651, #0c1c2c);
    border: 9px solid #b98b47;
    color: #f9dfad;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

.cover-inner {
    border: 1px solid #d7b06a;
    padding: 20px;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
}

.cover h2 {
    font-size: 30px;
    line-height: 1.4;
}

/* Кітап ішіндегі мазмұн */
.toc-page {
    background: #fffaf0;
    color: #26384c;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
}

.toc-page h2 {
    font-family: Georgia, serif;
    text-align: center;
    font-size: 25px;
    color: #80552a;
    margin: 5px 0 15px;
}

.toc-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 2px;
}

.toc-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
    padding: 6px 3px;
    border: none;
    border-bottom: 1px dotted #c4ae90;
    border-radius: 0;
    background: transparent;
    color: #26384c;
    font-family: Georgia, serif;
    font-size: 11px;
    font-weight: normal;
    text-align: left;
    cursor: pointer;
}

.toc-link:hover {
    background: #f0e0c4;
    color: #85551f;
}

.toc-link strong {
    color: #956328;
    white-space: nowrap;
}

.toc-footer {
    text-align: center;
    font-size: 11px;
    color: #997a50;
    margin-top: 12px;
}

.status {
    text-align: center;
    padding: 12px;
    color: #d9bd89;
}

footer {
    text-align: center;
    color: #b6bdc6;
    font-size: 12px;
    padding: 20px;
}

@media(max-width:600px) {
    .toolbar { gap: 6px; }
    button { padding: 9px; }
    .book-area { padding: 4px; }
}
</style>
</head>

<body>

<header>
    <small>ЭЛЕКТРОНДЫҚ ОҚУЛЫҚ · 2026</small>
    <h1>WEB БАҒДАРЛАМАЛАУ</h1>
    <p>15 дәріс · Интерактивті кітап</p>
</header>

<div class="toolbar">
    <button id="prev" disabled>← Артқа</button>
    <span id="counter">Жүктелуде...</span>
    <button id="next" disabled>Алға →</button>

    <input id="jump" type="number" min="1" placeholder="Бет">
    <button id="go" disabled>Өту</button>

    <button id="tocButton" disabled>☰ Мазмұны</button>
    <button id="fullscreen">⛶ Толық экран</button>

    <a class="download" href="book/backend.pdf" download>
        ↓ PDF
    </a>
</div>

<div class="status" id="loading">
    Кітап беттері жүктелуде...
</div>

<main class="book-area" id="bookArea">
    <div id="book" hidden></div>
</main>

<footer>
    С. Сейфуллин атындағы Қазақ агротехникалық зерттеу университеті
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
(async function () {

    // Дәрістер және PDF бетіндегі орналасуы
    const chapters = [
        {
            number: 1,
            title: "WEB-технологиялар негіздері. WEB стандарттары",
            page: 2
        },
        {
            number: 2,
            title: "Интернет коммуникациясының моделі. Pull және Push",
            page: 6
        },
        {
            number: 3,
            title: "Интернетке кіру. Соңғы миля. Модем",
            page: 9
        },
        {
            number: 4,
            title: "DSL және ISDN технологиялары",
            page: 12
        },
        {
            number: 5,
            title: "WEB-серверлер. CGI технологиясы. Скриптер",
            page: 14
        },
        {
            number: 6,
            title: "WEB-ресурстарды алу. Кэштеу. Прокси-сервер",
            page: 16
        },
        {
            number: 7,
            title: "Интернеттің іздеу технологиялары",
            page: 18
        },
        {
            number: 8,
            title: "Электрондық пошта. E-mail сервисі",
            page: 21
        },
        {
            number: 9,
            title: "Файлдармен алмасу. FTP сервисі",
            page: 24
        },
        {
            number: 10,
            title: "Мәліметтерді қорғау. Цифрлық қолтаңба",
            page: 26
        },
        {
            number: 11,
            title: "Пайдаланушыларды идентификациялау. Cookies",
            page: 29
        },
        {
            number: 12,
            title: "HTML мультимедиясы. Фреймдер және формалар",
            page: 37
        },
        {
            number: 13,
            title: "Стильдердің сатылы кестелері. CSS",
            page: 41
        },
        {
            number: 14,
            title: "JavaScript тілі",
            page: 45
        },
        {
            number: 15,
            title: "WEB-қосымшалар. HTTP, Perl және PHP",
            page: 50
        }
    ];

    const book = document.getElementById("book");
    const loading = document.getElementById("loading");
    const counter = document.getElementById("counter");

    try {
        if (!window.pdfjsLib || !window.St) {
            throw new Error("Кітапханалар жүктелмеді.");
        }

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const response = await fetch("book/backend.pdf");

        if (!response.ok) {
            throw new Error("book/backend.pdf табылмады.");
        }

        const bytes = await response.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
            data: bytes
        }).promise;

        // 1. Мұқаба
        const cover = document.createElement("div");
        cover.className = "page cover";
        cover.dataset.density = "hard";

        cover.innerHTML = `
            <div class="cover-inner">
                <span>ДӘРІСТЕР ЖИНАҒЫ</span>
                <h2>WEB<br>БАҒДАРЛАМАЛАУ</h2>
                <span>15 ДӘРІС</span>
                <span>АСТАНА · 2026</span>
            </div>
        `;

        book.appendChild(cover);

        // 2. Мазмұны
        const toc = document.createElement("div");
        toc.className = "page toc-page";

        const tocTitle = document.createElement("h2");
        tocTitle.textContent = "МАЗМҰНЫ";

        const tocList = document.createElement("div");
        tocList.className = "toc-list";

        toc.appendChild(tocTitle);
        toc.appendChild(tocList);

        const tocFooter = document.createElement("div");
        tocFooter.className = "toc-footer";
        tocFooter.textContent = "Дәріс атауын басып, қажетті бетке өтіңіз.";
        toc.appendChild(tocFooter);

        book.appendChild(toc);

        // PDF беттері
        for (let n = 1; n <= pdf.numPages; n++) {

            loading.textContent =
                `Беттер жүктелуде: ${n} / ${pdf.numPages}`;

            const page = await pdf.getPage(n);
            const viewport = page.getViewport({ scale: 1.25 });

            const canvas = document.createElement("canvas");
            canvas.width = Math.round(viewport.width);
            canvas.height = Math.round(viewport.height);

            await page.render({
                canvasContext: canvas.getContext("2d"),
                viewport: viewport
            }).promise;

            const div = document.createElement("div");
            div.className = "page";

            const img = document.createElement("img");
            img.alt = "PDF беті " + n;
            img.src = canvas.toDataURL("image/jpeg", 0.85);

            div.appendChild(img);
            book.appendChild(div);

            page.cleanup();

            await new Promise(resolve => setTimeout(resolve, 0));
        }

        // Кітап анимациясы
        const flip = new St.PageFlip(book, {
            width: 420,
            height: 594,
            size: "stretch",
            minWidth: 250,
            maxWidth: 420,
            minHeight: 354,
            maxHeight: 594,
            showCover: true,
            usePortrait: true,
            autoSize: true,
            maxShadowOpacity: 0.45,
            mobileScrollSupport: false
        });

        flip.loadFromHTML(book.querySelectorAll(".page"));

        // Мазмұндағы сілтемелер
        chapters.forEach(chapter => {

            const link = document.createElement("button");
            link.type = "button";
            link.className = "toc-link";

            const title = document.createElement("span");
            title.textContent =
                chapter.number + ". " + chapter.title;

            const pageNumber = document.createElement("strong");
            pageNumber.textContent = chapter.page + "-бет";

            link.append(title, pageNumber);

            link.addEventListener("pointerdown", event => {
                event.stopPropagation();
            });

            link.addEventListener("click", event => {
                event.preventDefault();
                event.stopPropagation();

                // 0 — мұқаба, 1 — мазмұны,
                // PDF бірінші беті — индекс 2
                flip.flip(chapter.page + 1);
            });

            tocList.appendChild(link);
        });

        book.hidden = false;
        loading.style.display = "none";

        const prev = document.getElementById("prev");
        const next = document.getElementById("next");
        const go = document.getElementById("go");
        const jump = document.getElementById("jump");
        const tocButton = document.getElementById("tocButton");

        function update() {
            const i = flip.getCurrentPageIndex();

            if (i === 0) {
                counter.textContent = "Мұқаба";
            } else if (i === 1) {
                counter.textContent = "Мазмұны";
            } else {
                counter.textContent =
                    "PDF беті " + (i - 1) + " / " + pdf.numPages;
            }

            prev.disabled = i === 0;
            next.disabled = i >= pdf.numPages + 1;
        }

        flip.on("flip", update);

        prev.onclick = () => flip.flipPrev();
        next.onclick = () => flip.flipNext();

        tocButton.disabled = false;
        tocButton.onclick = () => flip.flip(1);

        go.disabled = false;
        go.onclick = () => {
            const page = Number(jump.value);

            if (
                Number.isInteger(page) &&
                page >= 1 &&
                page <= pdf.numPages
            ) {
                flip.flip(page + 1);
            }
        };

        document.getElementById("fullscreen").onclick = () => {
            const area = document.getElementById("bookArea");

            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                area.requestFullscreen?.();
            }
        };

        document.addEventListener("keydown", event => {
            if (event.target.tagName === "INPUT") return;

            if (event.key === "ArrowRight") {
                flip.flipNext();
            }

            if (event.key === "ArrowLeft") {
                flip.flipPrev();
            }
        });

        update();

    } catch (error) {
        loading.textContent = "Қате: " + error.message;
        counter.textContent = "Қате";
        console.error(error);
    }

})();
</script>

</body>
</html>
